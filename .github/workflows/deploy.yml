name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backend setup
        working-directory: backend
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Frontend setup
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  deploy:
    name: Deploy to VPS
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_SSH_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/flickfindr
            git fetch origin main --quiet
            git reset --hard origin/main
            # deploy/.env holds real secrets — created ONCE manually on the box
            # (never in git). Abort if it's missing so we don't deploy broken.
            if [ ! -f deploy/.env ]; then
              echo "deploy/.env missing on VPS — create it first (see deploy/README)" >&2
              exit 1
            fi
            docker compose -f deploy/docker-compose.prod.yml build --pull
            docker compose -f deploy/docker-compose.prod.yml up -d
            docker image prune -f >/dev/null 2>&1 || true
