name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Branch model:
#   main = production (only merges from dev, protected)
#   dev  = integration (feature branches merge here first)
# CI runs on PRs (any base) and on pushes to main/dev. Docs-only changes skip
# the heavy jobs but still report a green check, so a required "CI" status
# never blocks a docs-only PR.

jobs:
  # Always runs (cheap) — guarantees the CI check passes even when code jobs skip.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'render.yaml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend (typecheck, test, build)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  frontend:
    name: Frontend (lint, test, build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  # Green signal even when both code jobs skip (docs-only changes).
  done:
    name: CI complete
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: echo "CI finished (code jobs skipped or passed)"
