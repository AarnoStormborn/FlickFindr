name: CI

on:
  push:
    branches: [main]
  pull_request:

# Efficient CI: docs-only / non-code changes skip the heavy jobs but still
# report a green check (so a required "CI" status never blocks a docs PR).
# Code changes in backend/ or frontend/ run full checks.

jobs:
  # Always runs (cheap) — guarantees the CI check passes even when code jobs skip.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'render.yaml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'

  backend:
    name: Backend (typecheck, test, build)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  frontend:
    name: Frontend (lint, build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  # Green signal even when both code jobs skip (docs-only changes).
  done:
    name: CI complete
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: echo "CI finished (code jobs skipped or passed)"
