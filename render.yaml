# Render blueprint — FlickFindr backend (free web service)
# Frontend deploys on Vercel; Postgres+pgvector on Supabase.
#
# Usage: render.yaml is picked up automatically when you create a "Blueprint"
# from this repo in Render, or copy the service config manually.
#
# Secrets/env to set in Render (Dashboard -> your service -> Environment):
#   DATABASE_URL           — Supabase connection string (postgres://...)
#   CORS_ORIGINS           — your Vercel app URL(s)
#   AGENT_ENABLED          — true/false
#   COMMAND_CODE_API_KEY   — enables the concierge agent (see backend/pi-agent/models.json)
#   PI_MODEL               — optional: pin one model id (provider/id)
#   AGENT_MODEL_FALLBACKS  — optional: comma-separated ordered fallbacks
#   TMDB_API_KEY           — optional

services:
  - type: web
    name: flickfindr-backend
    runtime: node
    plan: free
    rootDir: backend
    # --include=dev: Render sets NODE_ENV=production which makes plain
    # 'npm ci' skip devDependencies (typescript etc.) and the build fails.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /
    # Skip deploys for changes that don't affect this backend:
    # docs, markdown, frontend (Vercel's), ingest, tooling, CI.
    buildFilter:
      ignoredPaths:
        - 'docs/**'
        - '**/*.md'
        - 'frontend/**'
        - 'pi-ingest/**'
        - 'tools/**'
        - 'supabase/**'
        - '.github/**'
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000            # Render injects PORT; listen there
      # These are read from the service's environment (set in dashboard):
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AGENT_ENABLED
        sync: false
      # Enables the agent. Without it the concierge reports that it is not
      # configured and search silently uses the raw query.
      - key: COMMAND_CODE_API_KEY
        sync: false
      - key: PI_MODEL
        sync: false
      - key: AGENT_MODEL_FALLBACKS
        sync: false
      - key: TMDB_API_KEY
        sync: false
