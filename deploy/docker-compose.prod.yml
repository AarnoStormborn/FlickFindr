# FlickFindr production stack — single VPS via docker compose.
# Caddy (public :80/:443) -> frontend (nginx) + backend (Fastify), same origin.
# Postgres + Redis are private (internal network only).

services:
  postgres:
    image: pgvector/pgvector:pg16-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    networks: [internal]

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://redis:6379
      PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${APP_URL:-http://localhost}
      AGENT_ENABLED: ${AGENT_ENABLED:-true}
      PI_MODEL: ${PI_MODEL:-}
      AGENT_QUERY_TIMEOUT_MS: ${AGENT_QUERY_TIMEOUT_MS:-30000}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
    volumes:
      - hfcache:/app/.cache   # huggingface model cache (persist across restarts)
    networks: [internal]

  frontend:
    build:
      context: ../frontend
    restart: unless-stopped
    environment:
      API_BASE_URL: ""   # same-origin via Caddy proxy
    depends_on:
      - backend
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks: [internal]

volumes:
  pgdata:
  redisdata:
  hfcache:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
