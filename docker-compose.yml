services:
  postgres:
    image: pgvector/pgvector:pg16-trixie
    container_name: db_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flickfindr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flickfindr}
      POSTGRES_DB: ${POSTGRES_DB:-flickfindr}
    restart: always
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flickfindr} -d ${POSTGRES_DB:-flickfindr}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local